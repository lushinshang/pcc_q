<style>
  :root {
    --bg: #f4f7f8;
    --paper: #ffffff;
    --ink: #17252b;
    --muted: #5d7078;
    --line: #dbe5e8;
    --brand: #0f766e;
    --brand-deep: #115e59;
    --brand-soft: #dff4f1;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --green: #15803d;
    --green-soft: #e9f8ee;
    --amber: #a16207;
    --amber-soft: #fff6d8;
    --red: #b42318;
    --red-soft: #fff0ee;
    --shadow: 0 18px 50px rgba(33, 58, 67, 0.10);
    --radius: 20px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% -10%, rgba(15, 118, 110, 0.12), transparent 31rem),
      radial-gradient(circle at 92% 4%, rgba(37, 99, 235, 0.09), transparent 28rem),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
      "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.68;
    letter-spacing: 0;
  }

  body > header,
  body > nav,
  body > main,
  body > footer {
    width: min(1120px, calc(100% - 40px));
    margin-inline: auto;
  }

  body > header {
    position: relative;
    overflow: hidden;
    margin-top: 32px;
    padding: 54px 58px 50px;
    color: #fff;
    border-radius: 28px;
    background:
      linear-gradient(125deg, rgba(10, 75, 71, 0.98), rgba(15, 118, 110, 0.93) 58%, rgba(37, 99, 235, 0.88));
    box-shadow: var(--shadow);
  }

  body > header::after {
    content: "";
    position: absolute;
    right: -85px;
    bottom: -115px;
    width: 330px;
    height: 330px;
    border: 44px solid rgba(255, 255, 255, 0.08);
    border-radius: 50%;
  }

  body > header h1 {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0;
    color: #fff;
    font-size: clamp(2.35rem, 5vw, 3.55rem);
    line-height: 1.13;
    text-wrap: balance;
  }

  body > header .subtitle {
    position: relative;
    z-index: 1;
    margin: 14px 0 0;
    color: rgba(255, 255, 255, 0.92);
    font-size: clamp(1.05rem, 2.1vw, 1.42rem);
    font-weight: 650;
  }

  body > header .author,
  body > header .date {
    position: relative;
    z-index: 1;
    display: inline-block;
    margin: 28px 14px 0 0;
    color: rgba(255, 255, 255, 0.76);
    font-size: 0.9rem;
  }

  #TOC {
    position: sticky;
    top: 0;
    z-index: 30;
    width: 100%;
    max-width: none;
    margin-top: 26px;
    padding: 0 max(20px, calc((100vw - 1120px) / 2));
    overflow-x: auto;
    border-block: 1px solid rgba(219, 229, 232, 0.95);
    background: rgba(244, 247, 248, 0.91);
    backdrop-filter: blur(16px);
  }

  #TOC > ul {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: max-content;
    margin: 0;
    padding: 9px 0;
    list-style: none;
  }

  #TOC > ul > li > a {
    display: block;
    padding: 8px 12px;
    color: var(--muted);
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  #TOC > ul > li > a:hover,
  #TOC > ul > li > a:focus-visible {
    color: var(--brand-deep);
    background: var(--brand-soft);
    outline: none;
  }

  #TOC ul ul {
    display: none;
  }

  body > main {
    margin-top: 34px;
    margin-bottom: 70px;
    padding: 58px min(7vw, 76px) 70px;
    border: 1px solid rgba(219, 229, 232, 0.9);
    border-radius: 28px;
    background: var(--paper);
    box-shadow: var(--shadow);
  }

  main > section > :not(.status-grid, .architecture, table, pre, .executive-summary, .approval-box),
  main > :not(section, .status-grid, .architecture, table, pre, .executive-summary, .approval-box) {
    max-width: 780px;
  }

  h2,
  h3,
  h4 {
    color: var(--ink);
    line-height: 1.3;
    text-wrap: balance;
  }

  h2 {
    margin: 76px 0 24px;
    padding-top: 4px;
    font-size: clamp(1.55rem, 3vw, 2.05rem);
  }

  h2::before {
    content: "";
    display: block;
    width: 50px;
    height: 5px;
    margin-bottom: 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), var(--blue));
  }

  main > section:first-child h2:first-child,
  .executive-summary h2 {
    margin-top: 0;
  }

  h3 {
    margin: 38px 0 14px;
    font-size: 1.23rem;
  }

  h4 {
    margin: 26px 0 10px;
    font-size: 1.05rem;
  }

  p {
    margin: 0 0 1em;
    color: #31464e;
  }

  strong {
    color: #17333a;
  }

  a {
    color: var(--brand-deep);
    text-decoration-color: rgba(15, 118, 110, 0.42);
    text-underline-offset: 3px;
  }

  a:hover {
    color: var(--blue);
    text-decoration-color: currentColor;
  }

  ul,
  ol {
    margin-top: 0.75em;
    padding-left: 1.45em;
  }

  li {
    margin: 0.4em 0;
    padding-left: 0.2em;
  }

  code {
    padding: 0.12em 0.38em;
    color: #075985;
    border: 1px solid #d7e9f3;
    border-radius: 6px;
    background: #f1f8fc;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 0.88em;
  }

  pre {
    overflow-x: auto;
    margin: 24px 0;
    padding: 22px 24px;
    color: #d8f3ee;
    border: 1px solid #214b50;
    border-radius: 16px;
    background: #112d32;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  pre code {
    padding: 0;
    color: inherit;
    border: 0;
    background: transparent;
    font-size: 0.85rem;
    line-height: 1.62;
  }

  .executive-summary {
    max-width: none;
    margin: 0 0 26px;
    padding: 28px 30px 24px;
    border: 1px solid #b7ded8;
    border-left: 6px solid var(--brand);
    border-radius: 16px;
    background: linear-gradient(135deg, #f1fbf9, #f7fbff);
  }

  .executive-summary h2 {
    font-size: 1.5rem;
  }

  .executive-summary h2::before {
    display: none;
  }

  .executive-summary p:last-child {
    margin-bottom: 0;
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    max-width: none;
    margin: 26px 0 36px;
  }

  .status-card {
    min-height: 132px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fbfcfd;
  }

  .status-card.good {
    border-color: #b9dec6;
    background: var(--green-soft);
  }

  .status-card h3 {
    margin: 0 0 13px;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status-card p {
    margin: 0;
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.35;
  }

  .architecture {
    display: grid;
    grid-template-columns: 1fr auto 1.25fr auto 1fr auto 1fr auto 1fr;
    align-items: stretch;
    gap: 9px;
    max-width: none;
    margin: 24px 0 30px;
    padding: 22px;
    border: 1px solid #dce8eb;
    border-radius: 18px;
    background: #f7fafb;
  }

  .arch-node {
    display: flex;
    min-height: 120px;
    flex-direction: column;
    justify-content: center;
    padding: 16px;
    text-align: center;
    border: 1px solid #d5e0e3;
    border-radius: 14px;
    background: #fff;
    font-size: 0.82rem;
    line-height: 1.45;
  }

  .arch-node strong {
    display: block;
    margin-bottom: 7px;
    font-size: 0.94rem;
  }

  .arch-node.accent {
    border-color: #9ed4cd;
    background: var(--brand-soft);
  }

  .arch-node.success {
    border-color: #b8ddc4;
    background: var(--green-soft);
  }

  .arch-arrow {
    display: grid;
    place-items: center;
    color: var(--brand);
    font-size: 1.3rem;
    font-weight: 900;
  }

  table {
    display: table;
    width: 100%;
    margin: 22px 0 32px;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 0.88rem;
    line-height: 1.5;
  }

  th {
    padding: 13px 14px;
    color: #17383e;
    border-bottom: 1px solid #bfd4d8;
    background: #eaf4f3;
    font-weight: 800;
    text-align: left;
    vertical-align: top;
  }

  td {
    padding: 13px 14px;
    color: #324950;
    border-bottom: 1px solid #e4ebed;
    vertical-align: top;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  tbody tr:nth-child(even) {
    background: #fafcfc;
  }

  tbody tr:hover {
    background: #f1f8f7;
  }

  td:first-child,
  th:first-child {
    font-weight: 750;
  }

  .approval-box {
    max-width: none;
    margin: 30px 0;
    padding: 28px 30px;
    color: #312403;
    border: 1px solid #eed58b;
    border-radius: 16px;
    background: var(--amber-soft);
  }

  .approval-box h3 {
    margin-top: 0;
    color: #6d4700;
  }

  .approval-box p:last-child {
    margin-bottom: 0;
  }

  input[type="checkbox"] {
    width: 1rem;
    height: 1rem;
    margin-right: 0.45rem;
    accent-color: var(--brand);
  }

  hr {
    height: 1px;
    margin: 60px 0 28px;
    border: 0;
    background: var(--line);
  }

  body > footer {
    margin-bottom: 40px;
    color: var(--muted);
    text-align: center;
    font-size: 0.82rem;
  }

  @media (max-width: 900px) {
    body > main {
      padding-inline: 34px;
    }

    .status-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .architecture {
      grid-template-columns: 1fr;
    }

    .arch-node {
      min-height: 96px;
    }

    .arch-arrow {
      transform: rotate(90deg);
      min-height: 20px;
    }

    table {
      display: block;
      overflow-x: auto;
      white-space: normal;
    }
  }

  @media (max-width: 640px) {
    body {
      font-size: 15.5px;
      line-height: 1.66;
    }

    body > header,
    body > main {
      width: min(100% - 24px, 1120px);
    }

    body > header {
      margin-top: 12px;
      padding: 38px 24px 34px;
      border-radius: 20px;
    }

    body > header h1 {
      font-size: 2.25rem;
    }

    body > header .author,
    body > header .date {
      display: block;
      margin-top: 18px;
    }

    body > header .date {
      margin-top: 2px;
    }

    #TOC {
      margin-top: 12px;
      padding-inline: 12px;
    }

    #TOC > ul > li > a {
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    body > main {
      margin-top: 18px;
      margin-bottom: 26px;
      padding: 32px 20px 44px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 58px;
      font-size: 1.58rem;
    }

    h3 {
      margin-top: 32px;
    }

    .executive-summary,
    .approval-box {
      padding: 22px 20px;
    }

    .status-grid {
      grid-template-columns: 1fr;
    }

    .status-card {
      min-height: auto;
    }

    .architecture {
      padding: 14px;
    }

    pre {
      margin-inline: -6px;
      padding: 18px;
      border-radius: 12px;
    }

    table {
      width: calc(100% + 12px);
      margin-left: -6px;
      font-size: 0.82rem;
    }

    th,
    td {
      min-width: 128px;
      padding: 11px 12px;
    }
  }

  @media print {
    @page {
      margin: 15mm;
    }

    body {
      background: #fff;
      font-size: 10.5pt;
    }

    body > header,
    body > main {
      width: 100%;
      margin: 0;
      border: 0;
      box-shadow: none;
    }

    body > header {
      border-radius: 0;
      print-color-adjust: exact;
    }

    #TOC {
      position: static;
      display: none;
    }

    body > main {
      padding: 18px 0;
    }

    h2,
    h3 {
      break-after: avoid;
    }

    table,
    pre,
    .status-grid,
    .architecture,
    .approval-box {
      break-inside: avoid;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  }
</style>
