<!doctype html>
<html lang="$if(lang)$$lang$$else$zh-TW$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="$description$">
  <title>$pagetitle$</title>
  $for(header-includes)$
  $header-includes$
  $endfor$
</head>
<body>
  <header id="title-block-header">
    <h1>$title$</h1>
    $if(subtitle)$
    <p class="subtitle">$subtitle$</p>
    $endif$
    $if(author)$
    <p class="author">$for(author)$$author$$sep$、$endfor$</p>
    $endif$
    $if(date)$
    <p class="date">$date$</p>
    $endif$
  </header>
  $if(toc)$
  <nav id="TOC" aria-label="提案章節">
    $toc$
  </nav>
  $endif$
  <main id="content">
    $body$
  </main>
  <footer>
    <p>GitHub Pages 靜態化遷移提案 · 文件版本 1.0 · 2026-07-24</p>
  </footer>
</body>
</html>
