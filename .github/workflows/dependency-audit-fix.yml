name: Daily dependency audit fix

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    name: Fix and verify high-severity advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Go for pinned actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
      - name: Install locked dependencies
        run: npm ci
      - name: Attempt non-breaking audit fix
        run: npm audit fix || true
      - name: Check for lockfile changes
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reinstall from patched lockfile
        if: steps.diff.outputs.changed == 'true'
        run: npm ci
      - name: Run local quality gates against the patched lockfile
        if: steps.diff.outputs.changed == 'true'
        run: npm run validate
      - name: Commit and push the patched lockfile
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): daily npm audit fix"
          git push origin HEAD:main
      # 即使沒有可自動修復的變更、或修完仍有殘留漏洞，也要讓這步驟失敗並通知，
      # 不能悄悄放行——維持既有「任何異常都 fail closed」的原則。
      - name: Fail loudly if high-severity advisories remain
        run: npm audit --audit-level=high
