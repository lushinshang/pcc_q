name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Set up Go for pinned actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # 已 commit 的 public/data/tenders.json 是本機開發用的固定樣本，announcedDate
      # 寫死在最後一次更新當天；main 隔了幾天沒 push，E2E-T-004 的預設「一週」篩選
      # 就會篩出 0 筆而假陽性失敗。CI 用得到今天日期，改成每次都重新產生樣本資料，
      # 不依賴 commit 當下的日期，也不回寫這個檔案。
      - name: Generate sample dataset dated today
        run: npm run data:sample
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Strict typecheck
        run: npm run typecheck
      - name: Unit, parser, contract, and component coverage
        run: npm run test:coverage
      - name: Workflow policy checks
        run: npm run security:workflows
      - name: Workflow syntax and expression lint
        run: npm run workflow:lint
      - name: Repository secret scan
        run: npm run security:repo
      - name: Full Git history secret scan
        run: npm run security:history
      - name: Production build
        run: npm run build
      - name: HTML validation
        run: npm run validate:html
      - name: Bundle and artifact secret scan
        run: npm run security:dist
      - name: Desktop, mobile, CSP, and accessibility E2E
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
