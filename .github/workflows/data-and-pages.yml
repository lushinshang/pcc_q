name: Refresh data and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8-20 * * 1-5"
      timezone: Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Fetch, validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Go for pinned actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch fixed PCC source and validate dataset
        run: npm run fetch:data
      - name: Formatting, lint, strict types, and coverage
        run: npm run validate:code
      - name: Workflow policy checks
        run: npm run security:workflows
      - name: Workflow syntax and expression lint
        run: npm run workflow:lint
      - name: Repository secret scan
        run: npm run security:repo
      - name: Full Git history secret scan
        run: npm run security:history
      - name: Production build
        run: npm run build
      - name: HTML validation
        run: npm run validate:html
      - name: Bundle and artifact secret scan
        run: npm run security:dist
      - name: Desktop, mobile, CSP, and accessibility E2E
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Upload only the production dist directory
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy verified Pages artifact
    needs:
      - build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
